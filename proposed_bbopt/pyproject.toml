[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proposed-bbopt"
version = "0.1.0"
description = "Surrogate-assisted black-box optimizer with topological neural architecture adaptation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Proposed Algorithm Contributors" }]
dependencies = [
  "numpy>=1.20",
  "torch>=1.10",
  "joblib>=1.0",
  "matplotlib>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["proposed_bbopt*"]
